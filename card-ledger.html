<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f9"><meta name="referrer" content="no-referrer"><title>刷还卡明细</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172438;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}main{max-width:720px;margin:auto}h1{font-size:28px;line-height:1.15;margin:6px 0 5px;letter-spacing:-.03em}.sub{font-size:12px;color:#6c7a90;margin:4px 0 12px}.notice{background:#fff8e8;color:#75581f;border:1px solid #ead8a7;border-radius:14px;padding:11px 13px;font-size:12px;margin:12px 0}.filters{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.field label{display:block;font-size:11px;color:#718096;margin:0 0 5px 2px}.field select,.field input{width:100%;height:42px;border:1px solid #d5dde8;border-radius:11px;background:#fff;padding:0 10px;font:14px inherit;color:#213149}.field.full{grid-column:1/-1}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:11px}.metric span{display:block;font-size:10px;color:#748298}.metric b{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere}.positive{color:#b25033}.negative{color:#237653}.neutral{color:#305c94}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{display:block;width:100%;border:1px solid #d5dde8;border-radius:12px;background:#fff;color:#1668b3;font-weight:650;font-size:14px;text-align:center;text-decoration:none;padding:11px 12px}.btn.primary{background:#126bc0;border-color:#126bc0;color:#fff}.day{margin:18px 2px 7px;font-size:12px;color:#6e7d93;font-weight:700}.txn{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:16px;font-weight:750}.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}.spend{background:#fff1ec;color:#a34c2f}.pay{background:#ecf8f0;color:#247246}.amount{font-size:21px;font-weight:800;margin-top:6px}.meta{font-size:12px;color:#627289;margin-top:5px;word-break:break-word}.debt{background:#f7f9fc;border-radius:10px;padding:8px 10px;margin-top:9px;font-size:12px;color:#596a80}.empty{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:24px;text-align:center;color:#78869a;margin:12px 0}.foot{font-size:11px;color:#7a879a;margin:16px 2px}.status{font-size:12px;color:#2c6c50;margin:8px 2px}.error{color:#a1353e}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.metric b{font-size:17px}}
</style></head><body><main>
<h1>刷还卡明细</h1><div class="sub">按信用卡查看每笔刷卡和还款。旧记录从网页操作历史回填；以后新增操作会自动归档到独立明细档案。</div>
<div class="notice">这里展示的是你在债务管理器里记录的刷卡／还款流水，不是银行实时交易流水。明细档案使用独立本机存储，不会修改信用卡欠款、额度或还款状态。</div>
<div class="filters"><div class="grid">
<div class="field"><label>信用卡</label><select id="card"></select></div><div class="field"><label>月份</label><select id="month"></select></div>
<div class="field"><label>类型</label><select id="type"><option value="all">全部</option><option value="spend">只看刷卡</option><option value="pay">只看还款</option></select></div><div class="field"><label>搜索备注/资金账户</label><input id="q" placeholder="输入关键词"></div>
</div></div>
<div class="metrics"><div class="metric"><span>刷卡合计</span><b class="positive" id="spend">¥0.00</b></div><div class="metric"><span>还款合计</span><b class="negative" id="pay">¥0.00</b></div><div class="metric"><span>净变化</span><b class="neutral" id="net">¥0.00</b></div><div class="metric"><span>流水笔数</span><b id="count">0</b></div></div>
<div class="toolbar"><button class="btn primary" id="sync" type="button">刷新 / 回填旧明细</button><button class="btn" id="csv" type="button">导出当前筛选 CSV</button></div>
<div id="status" class="status"></div><div id="list"></div>
<a class="btn" href="./?bill_skip=1">返回债务管理器</a>
<div class="foot">“时间”采用你在债务管理器记录这笔操作的时间；如果备注中填写了实际消费日，可用搜索筛选。网页操作历史以后即使清空，已经归档到本页独立明细档案的记录仍会保留在本机。</div>
</main><script src="./card-ledger-core.js?v=1"></script><script src="./card-ledger-page.js?v=1"></script></body></html>
