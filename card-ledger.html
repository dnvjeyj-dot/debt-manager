<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f9"><meta name="referrer" content="no-referrer"><title>刷还卡明细</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172438;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:calc(18px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}main{max-width:720px;margin:auto}h1{font-size:28px;line-height:1.15;margin:6px 0 5px;letter-spacing:-.03em}.sub{font-size:12px;color:#6c7a90;margin:4px 0 12px}.notice{background:#fff8e8;color:#75581f;border:1px solid #ead8a7;border-radius:14px;padding:11px 13px;font-size:12px;margin:12px 0}.filters{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.field label{display:block;font-size:11px;color:#718096;margin:0 0 5px 2px}.field select,.field input{width:100%;height:42px;border:1px solid #d5dde8;border-radius:11px;background:#fff;padding:0 10px;font:14px inherit;color:#213149}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{background:#fff;border:1px solid #e1e7ef;border-radius:15px;padding:11px}.metric span{display:block;font-size:10px;color:#748298}.metric b{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere}.positive{color:#b25033}.negative{color:#237653}.neutral{color:#305c94}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{display:block;width:100%;border:1px solid #d5dde8;border-radius:12px;background:#fff;color:#1668b3;font-weight:650;font-size:14px;text-align:center;text-decoration:none;padding:11px 12px}.btn.primary{background:#126bc0;border-color:#126bc0;color:#fff}.day{margin:18px 2px 7px;font-size:12px;color:#6e7d93;font-weight:700}.txn{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:16px;font-weight:750}.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.badge,.source{font-size:10px;font-weight:700;padding:4px 7px;border-radius:999px;white-space:nowrap}.spend{background:#fff1ec;color:#a34c2f}.pay,.refund{background:#ecf8f0;color:#247246}.installment{background:#f0efff;color:#5c50a2}.interest,.fee{background:#fff3e6;color:#945619}.adjustment{background:#edf4ff;color:#275e9a}.source{background:#f3f5f8;color:#64738a}.source.mail{background:#eaf5ff;color:#1f699d}.source.both{background:#eef7ee;color:#3a7047}.amount{font-size:21px;font-weight:800;margin-top:6px}.amount.credit{color:#247246}.amount.debit{color:#a34c2f}.meta{font-size:12px;color:#627289;margin-top:5px;word-break:break-word}.desc{font-size:13px;color:#40526a}.debt{background:#f7f9fc;border-radius:10px;padding:8px 10px;margin-top:9px;font-size:12px;color:#596a80}.empty{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:24px;text-align:center;color:#78869a;margin:12px 0}.foot{font-size:11px;color:#7a879a;margin:16px 2px}.status{font-size:12px;color:#2c6c50;margin:8px 2px}.error{color:#a1353e}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.metric b{font-size:17px}.top{gap:6px}}</style></head><body><main>
<h1>刷还卡明细</h1><div class="sub">手工记录 + 电子账单明细。电子账单支持的银行会同步逐笔交易；无法提供逐笔明细的银行只保留账单汇总。</div>
<div class="notice">电子账单目前先支持兴业逐笔明细。这里不是银行实时流水；邮件账单通常只覆盖已出账交易。自动导入不会修改信用卡欠款、额度或还款状态。</div>
<div class="filters"><div class="grid"><div class="field"><label>信用卡</label><select id="card"></select></div><div class="field"><label>月份</label><select id="month"></select></div><div class="field"><label>类型</label><select id="type"><option value="all">全部</option><option value="spend">消费</option><option value="pay">还款</option><option value="refund">退款</option><option value="installment">分期</option><option value="interest">利息</option><option value="fee">费用</option><option value="adjustment">调整</option></select></div><div class="field"><label>搜索商户/备注/资金账户</label><input id="q" placeholder="输入关键词"></div></div></div>
<div class="metrics"><div class="metric"><span>账面增加</span><b class="positive" id="spend">¥0.00</b></div><div class="metric"><span>账面减少</span><b class="negative" id="pay">¥0.00</b></div><div class="metric"><span>净变化</span><b class="neutral" id="net">¥0.00</b></div><div class="metric"><span>流水笔数</span><b id="count">0</b></div></div>
<a class="btn primary" href="./bill-sync.html">同步电子账单明细</a><div class="toolbar"><button class="btn" id="sync" type="button">刷新 / 回填手工明细</button><button class="btn" id="csv" type="button">导出当前筛选 CSV</button></div><div id="status" class="status"></div><div id="list"></div><a class="btn" href="./?bill_skip=1">返回债务管理器</a>
<div class="foot">能确定为同一笔的手工记录与电子账单会合并标记，不重复统计。对无法可靠判断的同金额交易，宁可保留两笔供你核对，也不会擅自删除。电子账单逐笔数据成功写入 Safari 后，私有中转队列会在后续同步确认时删除。</div>
</main><script src="./card-ledger-core.js?v=2"></script><script src="./card-ledger-page.js?v=2"></script></body></html>
