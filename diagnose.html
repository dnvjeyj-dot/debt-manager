<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>债务管理器数据诊断</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e;margin:0;padding:24px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#16834a}.bad{color:#c62828}.muted{color:#7d8597;font-size:14px;line-height:1.5}b{font-size:18px}code{word-break:break-all}button{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid #d5d9e2;background:#fff}</style></head><body><h1>数据诊断</h1><div class="card"><b>这个页面只读</b><div class="muted">不会写入、清空或修改任何本地数据。</div></div><div id="out" class="card">正在检查…</div><div class="card"><button onclick="location.href='./?diag='+Date.now()">打开债务管理器</button></div><script>(()=>{const key='debt_manager_hosted_v1',el=document.getElementById('out');let raw=null;try{raw=localStorage.getItem(key)}catch(e){el.innerHTML='<div class="bad"><b>无法访问本地存储</b></div><div class="muted">'+String(e)+'</div>';return}if(!raw){el.innerHTML='<div class="bad"><b>未找到本地数据</b></div><div class="muted">当前网址：<code>'+location.origin+'</code><br>存储 key：<code>'+key+'</code><br>这说明这个 Safari 存储环境里没有那份数据。</div>';return}try{const d=JSON.parse(raw);const cards=Array.isArray(d.cards)?d.cards.length:'异常',debts=Array.isArray(d.debts)?d.debts.length:'异常',recv=Array.isArray(d.receivables)?d.receivables.length:'异常',hist=Array.isArray(d.history)?d.history.length:'异常';const paid=Array.isArray(d.debts)?d.debts.filter(x=>x&&x.lastPaymentMonth).map(x=>(x.name||'未命名')+'：'+x.lastPaymentMonth+(x.lastPaymentDate?' / '+x.lastPaymentDate:'')).slice(0,6):[];el.innerHTML='<div class="ok"><b>本地数据存在，而且 JSON 可解析</b></div><div class="muted" style="margin-top:10px">原始数据大小：'+raw.length.toLocaleString()+' 字符<br>信用卡：'+cards+'<br>债务：'+debts+'<br>应收：'+recv+'<br>操作历史：'+hist+'<br><br><b>已记录还款状态：</b><br>'+(paid.length?paid.join('<br>'):'没有 lastPaymentMonth 字段')+'</div>'}catch(e){el.innerHTML='<div class="bad"><b>本地数据存在，但 JSON 解析失败</b></div><div class="muted">原始数据大小：'+raw.length.toLocaleString()+' 字符<br>'+String(e)+'</div>'}})();</script></body></html>
