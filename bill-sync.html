<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f3f5f9"><title>账单自动同步</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172438;font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;padding:calc(20px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}main{max-width:660px;margin:auto}h1{font-size:28px;margin:6px 0 4px}h2{font-size:18px;margin:0 0 10px}.sub{font-size:13px;color:#66758b}section{background:white;border:1px solid #e1e6ee;border-radius:19px;padding:18px;margin:15px 0}button,a.btn{display:block;width:100%;font-family:inherit;font-size:15px;font-weight:650;line-height:1.5;text-align:center;border:1px solid #dce3ed;border-radius:12px;padding:12px;margin:10px 0 0;background:white;color:#126cc2;text-decoration:none;cursor:pointer}button.primary{background:#126cc2;color:#fff;border-color:#126cc2}button:disabled{opacity:.5}.notice{background:#fff8e9;border-radius:12px;padding:12px;font-size:13px;color:#77591b}.status{background:#edf5ff;padding:14px;border-radius:12px;white-space:pre-wrap;font-size:14px}.row{border-top:1px solid #edf0f5;padding:13px 0 4px;font-size:14px}.row b{display:block;margin-bottom:4px}.error{color:#b23b42}.success{color:#26794a}.muted{color:#69788c}.foot{font-size:12px;color:#7b879b;margin:20px 0}[hidden]{display:none!important}</style></head><body><main><h1>账单自动同步</h1><p class="sub">私有账单库 → 当前 Safari 本机账本</p><div id="message" class="status" role="status">正在检查本机数据…</div><section><h2>连接与同步</h2><p class="sub">只需配对一次。之后启动债务管理器时检查新账单，十分钟内不会重复跳转。私有服务登录过期时需要重新登录。</p><button id="connect" class="primary" type="button">连接私有账单库</button><button id="sync" type="button" hidden>立即同步</button><button id="off" type="button" hidden>关闭自动同步</button><button id="renew" type="button" hidden>重新配对此手机</button></section><section><h2>卡尾号映射</h2><p id="mapping" class="sub"></p><a class="btn" href="./card-map.html">查看 / 填写信用卡尾号</a></section><section><h2>最近同步结果</h2><div id="results" class="sub">尚未同步</div></section><p class="notice">只更新能唯一匹配的光大人民币单卡账单。已录入还款、同账期手工修改、过期账单、冲突或未匹配时保留现有账本；不会把出账金额重新加回已还款金额。同步不是银行实时余额查询。</p><a class="btn" href="./?bill_skip=1">返回债务管理器</a><p class="foot">账单写入前自动保留一份本机备份，也可在主程序“撤销上一步”。完整财务数据仍建议定期导出 JSON 备份。</p></main><script src="./bill-sync-core.js?v=1"></script><script src="./bill-sync-client.js?v=1"></script><script>
(function(){const $=id=>document.getElementById(id),S=window.DebtBillSync;let busy=false;
function view(){const cfg=S.config();try{const {data}=S.book();let m={};try{m=JSON.parse(localStorage.getItem('debt_manager_card_map_v1')||'{}')}catch(_){}const n=data.cards.filter(c=>/^\d{4}$/.test(m[c.name]||'')).length;$('mapping').textContent='本机 '+data.cards.length+' 张信用卡，已填写尾号 '+n+' 张。只匹配银行与尾号都一致的卡。';$('message').textContent=cfg.enabled?'已连接 · 启动时自动同步\n上次成功：'+(cfg.lastSuccess?new Date(cfg.lastSuccess).toLocaleString('zh-CN'):'尚未同步'):'本机账本已找到，请连接私有账单库。'}catch(e){$('message').textContent=e.message;$('connect').disabled=true;}
$('connect').hidden=!!cfg.enabled;$('sync').hidden=!cfg.linkId;$('off').hidden=!cfg.enabled;$('renew').hidden=!cfg.linkId;
const r=S.report();$('results').textContent='';if(!r){$('results').textContent='尚未同步';return}if(r.error){$('results').textContent=r.error;return}const info=document.createElement('p');info.textContent='最近检查：'+new Date(r.at).toLocaleString('zh-CN')+' · 更新 '+r.updated+' 张';$('results').appendChild(info);for(const x of r.results||[]){const row=document.createElement('div');row.className='row';const title=document.createElement('b');title.className=x.status==='updated'?'success':'muted';title.textContent=(x.cardName||'未匹配信用卡')+' · 尾号 '+x.last4;row.appendChild(title);const txt=document.createElement('div');txt.textContent=x.reason;row.appendChild(txt);$('results').appendChild(row);}}
async function start(renew){if(busy)return;busy=true;$('message').textContent='正在准备安全连接…';try{await S.begin('manual',renew)}catch(e){$('message').textContent=e.message;busy=false}}
$('connect').onclick=()=>start(false);$('sync').onclick=()=>start(false);$('renew').onclick=()=>{if(confirm('建立新的手机配对？不会删除财务数据。'))start(true)};$('off').onclick=()=>{S.disable();view()};
(async()=>{try{const r=await S.receive();if(r&&r.redirected)return;view()}catch(e){view();$('message').textContent=e.message+'。未自动重试，请保留现有账本。'}})();})();
</script></body></html>
