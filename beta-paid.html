<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>贷款本月状态测试</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#1c1c1e;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));background:#f2f2f7}
.wrap{max-width:680px;margin:auto}.head{margin:10px 0 18px}.head h1{font-size:30px;margin:0 0 6px}.muted{color:#7d8699;font-size:14px;line-height:1.5}
.note{background:#fff8e8;border:1px solid #e8d49c;border-radius:18px;padding:14px 16px;margin-bottom:16px;line-height:1.55;color:#76571c}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:700}.status{font-size:13px;font-weight:700;padding:5px 9px;border-radius:999px;white-space:nowrap}.paid{color:#277a4a;background:#edf9f1;border:1px solid #b9dfc7}.pending{color:#9a5d00;background:#fff8e8;border:1px solid #efd59d}
.detail{margin-top:9px;color:#677085;font-size:14px;line-height:1.55}.error{background:#fff0f0;color:#a33131;border:1px solid #e7b9b9;border-radius:18px;padding:16px}.okbox{background:#eef9f2;color:#28754a;border:1px solid #b9dfc7;border-radius:18px;padding:14px 16px;margin-bottom:14px}.btn{display:inline-block;margin-top:18px;padding:11px 15px;border-radius:14px;border:1px solid #cfd5df;background:#fff;color:#0a84ff;text-decoration:none;font-weight:600}
</style>
</head>
<body><div class="wrap">
<div class="head"><h1>贷款本月状态测试</h1><div class="muted">只读，不写入、不清空、不修改任何本地数据。</div></div>
<div class="note">正式版保持不变。这个页面只验证“本月已还”识别逻辑是否正确。</div>
<div id="out"></div>
<a class="btn" href="./">返回正式版</a>
</div>
<script>
(()=>{
 const KEY='debt_manager_hosted_v1';
 const out=document.getElementById('out');
 const pad=n=>String(n).padStart(2,'0');
 const now=new Date();
 const month=now.getFullYear()+'-'+pad(now.getMonth()+1);
 const money=n=>typeof n==='number'&&isFinite(n)?'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2}):'—';
 try{
   const raw=localStorage.getItem(KEY);
   if(!raw){out.innerHTML='<div class="error"><b>当前 Safari 环境未找到本地数据。</b></div>';return}
   const data=JSON.parse(raw);
   if(!data||!Array.isArray(data.debts)){throw new Error('债务数据结构不存在')}
   const history=Array.isArray(data.history)?data.history:[];
   const rows=data.debts.map(d=>{
     let payMonth=d.lastPaymentMonth||null;
     let payDate=d.lastPaymentDate||null;
     let payAmount=(typeof d.lastPaymentAmount==='number'?d.lastPaymentAmount:null);
     if(!payMonth){
       const hit=history.find(h=>h&&typeof h.title==='string'&&h.title.indexOf(String(d.name||'')+' 本期还款')===0);
       if(hit){
         const note=String(hit.note||'');
         const dm=note.match(/^(\d{4}-\d{2}-\d{2})/);
         if(dm){payDate=dm[1];payMonth=payDate.slice(0,7)}
         if(payAmount==null){const am=String(hit.title).match(/¥([\d,]+(?:\.\d+)?)/);if(am)payAmount=Number(am[1].replace(/,/g,''))}
       }
     }
     const paid=payMonth===month;
     return '<div class="card"><div class="row"><div class="name">'+String(d.name||'未命名贷款')+'</div><span class="status '+(paid?'paid':'pending')+'">'+(paid?'本月已还':'待处理')+'</span></div><div class="detail">还款日：'+(d.dueDay?d.dueDay+'日':'待补')+'<br>记录月份：'+(payMonth||'—')+'<br>最近还款：'+(payDate||'—')+(payAmount!=null?' · '+money(payAmount):'')+'</div></div>';
   }).join('');
   out.innerHTML='<div class="okbox">已读取本地数据：'+data.debts.length+' 笔债务；当前月份 '+month+'</div>'+rows;
 }catch(e){out.innerHTML='<div class="error"><b>读取失败：</b>'+String(e&&e.message||e)+'</div>'}
})();
</script>
</body></html>
