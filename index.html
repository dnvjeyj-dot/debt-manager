<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>债务管理器</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border-radius:22px;padding:24px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.mark{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}.muted{color:#8e8e93;font-size:13px;margin-top:8px}</style>

<body>

<script>
(async()=>{
 try{
  // Optional sync runs before the core reads localStorage; core remains unchanged.
  const qp=new URLSearchParams(location.search);
  if(qp.has('bill_skip')){qp.delete('bill_skip');history.replaceState(null,'',location.pathname+(qp.toString()?'?'+qp.toString():'')+location.hash);}
  else try{
    const cfg=JSON.parse(localStorage.getItem('debt_manager_bill_sync_config_v1')||'null');
    if(cfg&&cfg.enabled&&navigator.onLine!==false&&Date.now()-(cfg.lastAttempt||0)>=600000){
      const loaded=await new Promise(resolve=>{const el=document.createElement('script');let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)};const timer=setTimeout(()=>finish(false),3000);el.onload=()=>finish(true);el.onerror=()=>finish(false);el.src='./bill-sync-client.js?v=6';document.head.appendChild(el)});
      if(loaded&&window.DebtBillSync&&await window.DebtBillSync.beforeBoot()===false)return;
    }
  }catch(_){}
  if(typeof DecompressionStream==='undefined')throw new Error('当前Safari版本过旧，请先更新iOS');
  const files=['v9-1.b64?v=11','v9-2.b64?v=11','v9-3.b64?v=11','v9-4.b64?v=11','v9-5.b64?v=11','v9-6.b64?v=11'];
  const texts=await Promise.all(files.map(async f=>{const r=await fetch('./'+f,{cache:'no-store'});if(!r.ok)throw new Error('程序文件加载失败：'+f);return (await r.text()).trim()}));
  const raw=atob(texts.join(''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let app=await new Response(stream).text();
  // Settled loans stay in local history but disappear from operational views.
  app=app.replace('function debtMonthlyRequired(d){','let showSettledLoans=false;\nfunction debtIsActive(d){if(!d||d.balance===null||d.balance===undefined||d.balance==="")return true;const n=Number(d.balance);return !Number.isFinite(n)||n>0.005}\nfunction debtMonthlyRequired(d){\n  if(!debtIsActive(d))return 0;');
  app=app.replaceAll('data.debts.forEach(d=>{\n    if(d.dueDay){','data.debts.forEach(d=>{\n    if(!debtIsActive(d))return;\n    if(d.dueDay){');
  app=app.replace('  // Debts\n  data.debts.forEach((d,idx)=>{','  // Debts\n  data.debts.forEach((d,idx)=>{\n    if(!debtIsActive(d))return;');
  app=app.replace('  data.debts.forEach((d,idx)=>{\n    const req=debtMonthlyRequired(d);','  data.debts.forEach((d,idx)=>{\n    if(!debtIsActive(d))return;\n    const req=debtMonthlyRequired(d);');
  app=app.replace('duplicateNames(data.debts).forEach(','duplicateNames(data.debts.filter(debtIsActive)).forEach(');
  app=app.replace('let list=data.debts.filter(d=>d.maturity)','let list=data.debts.filter(d=>debtIsActive(d)&&d.maturity)');
  app=app.replace('function renderDebts(){\n  const rows=data.debts.map((d,idx)=>{','function renderDebts(){\n  const active=data.debts.map((d,idx)=>({d,idx})).filter(x=>showSettledLoans||debtIsActive(x.d));\n  const rows=active.map(({d,idx})=>{');
  app=app.replace("$('debtMobile').innerHTML=data.debts.map((d,idx)=>","$('debtMobile').innerHTML=active.map(({d,idx})=>");
  app=app.replace('const maturities=data.debts.filter(d=>d.maturity)','const maturities=data.debts.filter(d=>debtIsActive(d)&&d.maturity)');
  app=app.replace('未特别说明的私人借款默认先息后本','未特别说明的私人借款默认先息后本 · 已结清贷款自动隐藏，历史数据保留');
  // An opt-in archive view allows corrections without exposing settled loans by default.
  app=app.replace('<button class="btn primary" id="addDebtBtn" type="button">新增负债</button>', '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn small" id="toggleSettledLoans" type="button" aria-expanded="false">查看已结清</button><button class="btn primary" id="addDebtBtn" type="button">新增负债</button></div>');
  app=app.replace("  $('debtMobile').innerHTML=active.map(({d,idx})=>", "  const settledCount=data.debts.filter(d=>!debtIsActive(d)).length;const toggle=$('toggleSettledLoans');if(toggle){toggle.style.display=settledCount?'':'none';toggle.textContent=showSettledLoans?'隐藏已结清':'查看已结清（'+settledCount+'）';toggle.setAttribute('aria-expanded',String(showSettledLoans));}\n  $('debtMobile').innerHTML=active.map(({d,idx})=>");
  app=app.replace("kv('本月状态',d.lastPaymentMonth===nowMonthKey()?'已还':'待处理')","kv('本月状态',!debtIsActive(d)?'已结清':d.lastPaymentMonth===nowMonthKey()?'已还':'待处理')");
  app=app.replace("  ).join('');\n}\nfunction renderReceivables(){", "  ).join('');\n  ['debtTable','debtMobile'].forEach(id=>$(id).querySelectorAll('[data-dact=pay]').forEach(btn=>{if(!debtIsActive(data.debts[Number(btn.dataset.idx)]))btn.style.display='none'}));\n}\ndocument.addEventListener('click',e=>{if(e.target&&e.target.closest('#toggleSettledLoans')){showSettledLoans=!showSettledLoans;renderDebts();}});\nfunction renderReceivables(){");
  app=app.replace('<button type="button" data-more-page="data">','<button type="button" id="billSyncEntry"><span class="mi">↻</span>账单同步</button><button type="button" data-more-page="data">');
  app=app.replace('<button class="btn" id="exportBtn"','<a class="btn" href="./bill-sync.html" style="text-decoration:none">账单同步</a><button class="btn" id="exportBtn"');
  app=app.replace('iPhone 版 · 数据仅保存在本机','本机账本 · 可选私有账单同步');
  app=app.replace('</body>','<script src="./home-available-v10.js?v=11"><\/script><script src="./bill-sync-core.js?v=5"><\/script><script src="./bill-sync-status.js?v=5"><\/script><script src="./bill-sync-badges.js?v=5"><\/script><script src="./bill-sync-guard.js?v=1"><\/script><script src="./repayment-reminders-core.js?v=1"><\/script><script src="./repayment-reminders-entry.js?v=1"><\/script><script src="./card-ledger-core.js?v=3"><\/script><script src="./card-ledger-bridge.js?v=3"><\/script></body>');
  document.open();document.write(app);document.close();
 }catch(e){document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">!</div><b>启动失败</b><div class="muted">'+String(e.message||e)+'</div></div></div>'}
})();
</script>
