<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="债务管理器">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest?v=11">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<title>债务管理器</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border-radius:22px;padding:24px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.mark{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}.muted{color:#8e8e93;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark">¥</div><b>债务管理器正在启动</b><div class="muted">正在加载债务管理器</div><a href="./?bill_skip=1" style="display:block;margin-top:14px;color:#0868c9;font-size:13px">暂不同步，打开本机账本</a></div></div>
<script>
(async()=>{
 try{
  // Optional sync runs before the core reads localStorage; core remains unchanged.
  const qp=new URLSearchParams(location.search);
  if(qp.has('bill_skip')){qp.delete('bill_skip');history.replaceState(null,'',location.pathname+(qp.toString()?'?'+qp.toString():'')+location.hash);}
  else try{
    const cfg=JSON.parse(localStorage.getItem('debt_manager_bill_sync_config_v1')||'null');
    if(cfg&&cfg.enabled&&navigator.onLine!==false&&Date.now()-(cfg.lastAttempt||0)>=600000){
      const loaded=await new Promise(resolve=>{const el=document.createElement('script');let done=false;const finish=v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)};const timer=setTimeout(()=>finish(false),3000);el.onload=()=>finish(true);el.onerror=()=>finish(false);el.src='./bill-sync-client.js?v=2';document.head.appendChild(el)});
      if(loaded&&window.DebtBillSync&&await window.DebtBillSync.beforeBoot()===false)return;
    }
  }catch(_){}
  if(typeof DecompressionStream==='undefined')throw new Error('当前Safari版本过旧，请先更新iOS');
  const files=['v9-1.b64?v=11','v9-2.b64?v=11','v9-3.b64?v=11','v9-4.b64?v=11','v9-5.b64?v=11','v9-6.b64?v=11'];
  const texts=await Promise.all(files.map(async f=>{const r=await fetch('./'+f,{cache:'no-store'});if(!r.ok)throw new Error('程序文件加载失败：'+f);return (await r.text()).trim()}));
  const raw=atob(texts.join(''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  let app=await new Response(stream).text();
  app=app.replace('<button type="button" data-more-page="data">','<button type="button" id="billSyncEntry"><span class="mi">↻</span>账单同步</button><button type="button" data-more-page="data">');
  app=app.replace('<button class="btn" id="exportBtn"','<a class="btn" href="./bill-sync.html" style="text-decoration:none">账单同步</a><button class="btn" id="exportBtn"');
  app=app.replace('iPhone 版 · 数据仅保存在本机','本机账本 · 可选私有账单同步');
  app=app.replace('</body>','<script src="./home-available-v10.js?v=11"><\/script><script src="./bill-sync-guard.js?v=1"><\/script></body>');
  document.open();document.write(app);document.close();
 }catch(e){document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">!</div><b>启动失败</b><div class="muted">'+String(e.message||e)+'</div></div></div>'}
})();
</script>
</body>
</html>
