<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="债务管理器">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<title>债务管理器</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border-radius:22px;padding:24px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.mark{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}.muted{color:#8e8e93;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark">¥</div><b>债务管理器正在启动</b><div class="muted">正在加载 iPhone 版界面</div></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined')throw new Error('当前Safari版本过旧，请先更新iOS');
    const files=['app-1.b64?v=3','app-2.b64?v=3','app-3.b64?v=3','app-4.b64?v=3'];
    const texts=await Promise.all(files.map(async f=>{
      const r=await fetch('./'+f,{cache:'no-store'});
      if(!r.ok)throw new Error('程序文件加载失败：'+f);
      return (await r.text()).trim();
    }));
    const b64=texts.join('');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let app=await new Response(stream).text();
    app=app.replace('<meta name="apple-mobile-web-app-capable" content="yes">','');
    app=app.replace('href="manifest.webmanifest"','href="manifest.webmanifest?v=3"');
    const coveragePatch=`<style>
#coverageTable table{min-width:0!important;table-layout:fixed}
#coverageTable th:nth-child(1),#coverageTable td:nth-child(1){width:104px;text-align:left}
#coverageTable th:nth-child(2),#coverageTable td:nth-child(2){text-align:left;overflow:hidden;text-overflow:ellipsis}
#coverageTable th:nth-child(3),#coverageTable td:nth-child(3){width:86px;text-align:left}
#coverageTable th:nth-child(4),#coverageTable td:nth-child(4){width:118px;text-align:right}
.coverage-date-short,.coverage-kind-mobile{display:none}
@media(max-width:760px){
 #coverageTable{overflow:hidden}
 #coverageTable table{min-width:0!important;width:100%;table-layout:fixed}
 #coverageTable th,#coverageTable td{padding:10px 7px}
 #coverageTable th:nth-child(1),#coverageTable td:nth-child(1){width:60px}
 #coverageTable th:nth-child(2),#coverageTable td:nth-child(2){width:auto;white-space:normal}
 #coverageTable th:nth-child(3),#coverageTable td:nth-child(3){display:none}
 #coverageTable th:nth-child(4),#coverageTable td:nth-child(4){width:96px}
 .coverage-date-full{display:none}.coverage-date-short{display:inline}
 .coverage-kind-mobile{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
}
</style><script>
(()=>{
 const enhance=()=>{
  const table=document.querySelector('#coverageTable table');
  if(!table)return;
  table.querySelectorAll('tbody tr').forEach(tr=>{
   const c=tr.cells;if(!c||c.length<4)return;
   const raw=(c[0].textContent||'').trim();
   if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)&&!c[0].querySelector('.coverage-date-full')){
    c[0].innerHTML='<span class="coverage-date-full">'+raw+'</span><span class="coverage-date-short">'+raw.slice(5)+'</span>';
   }
   if(!c[1].querySelector('.coverage-kind-mobile')){
    const kind=(c[2].textContent||'').trim();
    if(kind&&kind!=='—'){
     const d=document.createElement('div');d.className='coverage-kind-mobile';d.textContent=kind;c[1].appendChild(d);
    }
   }
  });
 };
 const box=document.getElementById('coverageTable');
 if(box){new MutationObserver(enhance).observe(box,{childList:true,subtree:true});enhance();}
})();
<\/script>`;
    app=app.replace('</body>',coveragePatch+'</body>');
    document.open();document.write(app);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">!</div><b>启动失败</b><div class="muted">'+String(e.message||e)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
