<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="债务管理器">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<title>债务管理器</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f2f2f7;color:#1c1c1e}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border-radius:22px;padding:24px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.08)}.mark{width:54px;height:54px;margin:0 auto 12px;border-radius:16px;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:800}.muted{color:#8e8e93;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div class="loading"><div class="box"><div class="mark">¥</div><b>债务管理器正在启动</b><div class="muted">正在加载 iPhone 版界面</div></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined')throw new Error('当前Safari版本过旧，请先更新iOS');
    const files=['app-1.b64?v=5','app-2.b64?v=5','app-3.b64?v=5','app-4.b64?v=5'];
    const texts=await Promise.all(files.map(async f=>{
      const r=await fetch('./'+f,{cache:'no-store'});
      if(!r.ok)throw new Error('程序文件加载失败：'+f);
      return (await r.text()).trim();
    }));
    const b64=texts.join('');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let app=await new Response(stream).text();
    app=app.replace('<meta name="apple-mobile-web-app-capable" content="yes">','');
    app=app.replace('href="manifest.webmanifest"','href="manifest.webmanifest?v=5"');
    const coveragePatch=`<style>
#coverageTable table{min-width:0!important;table-layout:fixed}
#coverageTable th:nth-child(1),#coverageTable td:nth-child(1){width:104px;text-align:left}
#coverageTable th:nth-child(2),#coverageTable td:nth-child(2){text-align:left;overflow:hidden;text-overflow:ellipsis}
#coverageTable th:nth-child(3),#coverageTable td:nth-child(3){width:86px;text-align:left}
#coverageTable th:nth-child(4),#coverageTable td:nth-child(4){width:118px;text-align:right}
.coverage-date-short,.coverage-kind-mobile{display:none}
@media(max-width:760px){
 #coverageTable{overflow:hidden}
 #coverageTable table{min-width:0!important;width:100%;table-layout:fixed}
 #coverageTable th,#coverageTable td{padding:10px 7px}
 #coverageTable th:nth-child(1),#coverageTable td:nth-child(1){width:60px}
 #coverageTable th:nth-child(2),#coverageTable td:nth-child(2){width:auto;white-space:normal}
 #coverageTable th:nth-child(3),#coverageTable td:nth-child(3){display:none}
 #coverageTable th:nth-child(4),#coverageTable td:nth-child(4){width:96px}
 .coverage-date-full{display:none}.coverage-date-short{display:inline}
 .coverage-kind-mobile{display:block;color:var(--muted);font-size:11px;line-height:1.3;margin-top:2px}
}
</style><script>
(()=>{
 const enhance=()=>{
  const table=document.querySelector('#coverageTable table');
  if(!table)return;
  table.querySelectorAll('tbody tr').forEach(tr=>{
   const c=tr.cells;if(!c||c.length<4)return;
   const raw=(c[0].textContent||'').trim();
   if(/^\\d{4}-\\d{2}-\\d{2}$/.test(raw)&&!c[0].querySelector('.coverage-date-full')){
    c[0].innerHTML='<span class="coverage-date-full">'+raw+'</span><span class="coverage-date-short">'+raw.slice(5)+'</span>';
   }
   if(!c[1].querySelector('.coverage-kind-mobile')){
    const kind=(c[2].textContent||'').trim();
    if(kind&&kind!=='—'){
     const d=document.createElement('div');d.className='coverage-kind-mobile';d.textContent=kind;c[1].appendChild(d);
    }
   }
  });
 };
 const box=document.getElementById('coverageTable');
 if(box){new MutationObserver(enhance).observe(box,{childList:true,subtree:true});enhance();}
})();
<\/script>`;
    const debtPaymentPatch=`<script>
(()=>{
 const monthKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
 data.debtDueStatus=data.debtDueStatus&&typeof data.debtDueStatus==='object'?data.debtDueStatus:{};
 document.body.insertAdjacentHTML('beforeend',
  '<div class="modal" id="debtDueModal" role="dialog" aria-modal="true" aria-labelledby="debtDueTitle"><div class="modal-card">'+
  '<h3 id="debtDueTitle">记录本期还款</h3>'+
  '<div class="callout">用于确认本月还款已经处理。先息后本默认冲本金为0；等额本息如果不知道本期冲本金金额，可以留空，程序只记录已还，不改本金余额。</div>'+
  '<div class="form-grid" style="margin-top:12px">'+
  '<div class="field"><label for="debtDueAmount">本次实际支付</label><input id="debtDueAmount" type="number" min="0.01" step="0.01" inputmode="decimal"></div>'+
  '<div class="field"><label for="debtDuePrincipal">其中冲本金（可留空）</label><input id="debtDuePrincipal" type="number" min="0" step="0.01" inputmode="decimal"></div>'+
  '<div class="field"><label for="debtDueDate">实际还款日期</label><input id="debtDueDate" type="date"></div>'+
  '<div class="field"><label for="debtDueFund">资金账户（可选）</label><select id="debtDueFund"></select></div></div>'+
  '<div class="modal-actions"><button class="btn" data-close="debtDueModal" type="button">取消</button><button class="btn primary" id="debtDueSaveBtn" type="button">确认本期已还</button></div></div></div>');
 let dueIdx=null;
 const openDue=(idx)=>{
  const d=data.debts[idx];if(!d)return;dueIdx=idx;
  const req=debtMonthlyRequired(d);
  $('debtDueTitle').textContent=d.name+' · 记录本期还款';
  $('debtDueAmount').value=req===null?'':round2(req);
  $('debtDuePrincipal').value=d.method==='先息后本'?0:'';
  $('debtDueDate').value=todayISO();
  populateFundSelect('debtDueFund','本期还款不关联资金账户');$('debtDueFund').value='';
  openModal('debtDueModal');
 };
 const saveDue=()=>{
  const d=data.debts[dueIdx];if(!d)return;
  const amount=round2(Number($('debtDueAmount').value));if(!(amount>0)){toast('请输入实际支付金额');return}
  const raw=$('debtDuePrincipal').value.trim();
  const principal=raw===''?null:round2(Number(raw));
  if(principal!==null&&(!isFinite(principal)||principal<0||principal>amount+0.005||principal>d.balance+0.005)){toast('冲本金金额不正确');return}
  const fundVal=$('debtDueFund').value;
  if(fundVal!==''){const f=data.funds[Number(fundVal)];if(!f||usableFund(f)+0.005<amount){toast((f?f.name:'资金账户')+' 可动用资金不足');return}}
  snapshot('本期还款 '+d.name);
  const before=d.balance;touch(d);
  if(principal!==null){
   if(principal>0){addMonthStat('debtPrincipalPayments',principal);d.balance=round2(Math.max(0,d.balance-principal))}
   const interest=round2(Math.max(0,amount-principal));if(interest>0)addMonthStat('interestPaid',interest);
  }
  let fundName='';if(fundVal!==''){const res=deductFund(Number(fundVal),amount,'本期还款');if(res.ok)fundName=res.name}
  const payDate=$('debtDueDate').value||todayISO();
  data.debtDueStatus[d.name]={month:monthKey(),date:payDate,amount,principal};
  const principalNote=principal===null?'本金部分未录':('冲本金 '+money(principal)+(d.balance!==before?' · 本金 '+money(before)+' → '+money(d.balance):''));
  data.history.unshift({time:new Date().toISOString(),title:d.name+' 本期还款 '+money(amount),note:payDate+' · '+principalNote+(fundName?' · 从 '+fundName+' 扣款':'')});
  closeModal('debtDueModal');save('本期还款已记录');
 };
 const originalBattleMonthItems=battleMonthItems;
 battleMonthItems=function(){
  const r=originalBattleMonthItems();const mk=monthKey();
  r.items=r.items.filter(x=>!(x.action==='debt'&&data.debts[x.idx]&&data.debtDueStatus[data.debts[x.idx].name]&&data.debtDueStatus[data.debts[x.idx].name].month===mk));
  return r;
 };
 const originalRenderBattle=renderBattle;
 renderBattle=function(){
  originalRenderBattle();
  document.querySelectorAll('#battleTimeline button[data-bact="debtEdit"]').forEach(b=>{b.dataset.bact='debtDue';b.textContent='记录还款';b.classList.add('primary')});
 };
 $('battleTimeline').addEventListener('click',e=>{const b=e.target.closest('button[data-bact="debtDue"]');if(b)openDue(Number(b.dataset.idx))});
 $('debtDueSaveBtn').addEventListener('click',saveDue);
 document.querySelectorAll('[data-close="debtDueModal"]').forEach(b=>b.addEventListener('click',()=>closeModal('debtDueModal')));
 renderBattle();persist();
})();
<\/script>`;
    app=app.replace('</body>',coveragePatch+debtPaymentPatch+'</body>');
    document.open();document.write(app);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div class="box"><div class="mark">!</div><b>启动失败</b><div class="muted">'+String(e.message||e)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
