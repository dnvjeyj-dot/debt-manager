addEventListener('click',saveDebtPay);\n$('debtDueSaveBtn').addEventListener('click',saveDebtDuePay);"],["  if(b.dataset.bact==='debtEdit')openDebtEditor(idx);","  if(b.dataset.bact==='debtPay')openDebtDuePay(idx);"]];

      ["    parsed.debts.forEach(d=>{if(!('monthlyPayment' in d))d.monthlyPayment=null;if(!('note' in d))d.note='';if(d.maturity==='待补')d.maturity=null;if(!('lastTouchedAt' in d))d.lastTouchedAt=null;if(!('lastPaymentMonth' in d))d.lastPaymentMonth=null;if(!('lastPaymentDate' in d))d.lastPaymentDate=null;if(!('lastPaymentAmount' in d))d.lastPaymentAmount=null});\n    return parsed;",
       "    parsed.debts.forEach(d=>{if(!('monthlyPayment' in d))d.monthlyPayment=null;if(!('note' in d))d.note='';if(d.maturity==='待补')d.maturity=null;if(!('lastTouchedAt' in d))d.lastTouchedAt=null;if(!('lastPaymentMonth' in d))d.lastPaymentMonth=null;if(!('lastPaymentDate' in d))d.lastPaymentDate=null;if(!('lastPaymentAmount' in d))d.lastPaymentAmount=null});\n    parsed.debts.forEach(d=>{if(d.lastPaymentMonth)return;const hit=parsed.history.find(h=>h&&typeof h.title==='string'&&h.title.indexOf(d.name+' 本期还款')===0);if(!hit)return;const note=String(hit.note||'');const dm=note.match(/^(\\d{4}-\\d{2}-\\d{2})/);let payDate=dm?dm[1]:null;if(!payDate&&hit.time){const dt=new Date(hit.time);if(!isNaN(dt.getTime()))payDate=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}if(payDate){d.lastPaymentDate=payDate;d.lastPaymentMonth=payDate.slice(0,7)}const am=String(hit.title).match(/¥([\\d,]+(?:\\.\\d+)?)/);if(am)d.lastPaymentAmount=Number(am[1].replace(/,/g,''));});\n    return parsed;"],
      ["  $('battleTimeline').innerHTML=bm.items.length?bm.items.map(x=>{",

#coverageTable table{min-width:0!important;table-layout:fixed}

 #coverageTable table{min-width:0!important;width:100%;table-layout:fixed}

</style><script>
(()=>{
 const enhance=()=>{
  const table=document.querySelector('#coverageTable table');

    c[0].innerHTML='<span class="coverage-date-full">'+raw+'</span><span class="coverage-date-short">'+raw.slice(5)+'</span>';

 };

})();
