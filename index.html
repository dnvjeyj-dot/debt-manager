<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="债务管理器">
<meta name="theme-color" content="#f4f6fa">
<link rel="manifest" href="manifest.webmanifest">
<title>债务管理器</title>
<style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f4f6fa;color:#182033}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.box{background:#fff;border:1px solid #dce2ec;border-radius:16px;padding:22px;max-width:360px;box-shadow:0 8px 24px rgba(26,42,72,.08)}.muted{color:#71809b;font-size:13px;margin-top:8px}</style>
</head>
<body>
<div class="loading"><div class="box"><b>债务管理器正在启动</b><div class="muted">首次打开需要几秒，之后可离线使用。</div></div></div>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined')throw new Error('当前Safari版本过旧，请先更新iOS');
    const files=['app-1.b64','app-2.b64','app-3.b64','app-4.b64'];
    const texts=await Promise.all(files.map(async f=>{
      const r=await fetch('./'+f,{cache:'no-store'});
      if(!r.ok)throw new Error('程序文件加载失败：'+f);
      return (await r.text()).trim();
    }));
    const b64=texts.join('');
    const raw=atob(b64);
    const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const app=await new Response(stream).text();
    document.open();document.write(app);document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading"><div class="box"><b>启动失败</b><div class="muted">'+String(e.message||e)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
